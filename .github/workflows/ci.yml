# Local checks only: no Hetzner credentials, deployments or package publication.
# GitHub still supplies its scoped automatic token; this is not a token-free job.
# Actions are pinned to verified full commit SHAs; no checkout token is persisted.
name: Local validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: ./scripts/validate.sh
